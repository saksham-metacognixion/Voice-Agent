name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 1. lint, typecheck, tests, contract
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: portal, POSTGRES_PASSWORD: portal, POSTGRES_DB: portal }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal -d portal" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Three URLs, two roles — ADR 0006. The e2e suites assert that DATABASE_URL is
      # genuinely RLS-enforced, so pointing it at the owner here would fail the build.
      DATABASE_URL: postgresql://portal_app:portal_app@localhost:5432/portal?schema=public
      ADMIN_DATABASE_URL: postgresql://portal_admin:portal_admin@localhost:5432/portal?schema=public
      DIRECT_DATABASE_URL: postgresql://portal:portal@localhost:5432/portal?schema=public
      REDIS_URL: redis://localhost:6379
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portal/db generate
      - run: pnpm turbo run lint typecheck
      - run: pnpm turbo run build
      - run: pnpm turbo run test

      # D7: the OpenAPI document and the generated client must match the controllers and the
      # manifest. A route added without a manifest entry, or a regenerate that was not
      # committed, fails here.
      - name: OpenAPI contract is current
        run: pnpm --filter @portal/api openapi:check

      # The migration creates the two group roles; this gives them a local password.
      - name: Apply migrations and seed
        run: |
          pnpm --filter @portal/db exec prisma migrate deploy
          pnpm --filter @portal/db exec node prisma/dev-roles.mjs
          pnpm --filter @portal/db exec tsx prisma/seed.ts

      # RLS isolation, append-only history, the auth boundaries, the money path, the D5–D7
      # lifecycles. These need a real Postgres and Redis and gate every pull request.
      - name: Security, tenancy and integration tests
        run: pnpm turbo run test:e2e

      - name: Compose file is valid
        run: API_DOMAIN=api.example.com docker compose -f infra/docker-compose.prod.yml config --quiet

  # ------------------------------------------------------------------ 2. the backend image
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [check]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR refuses an uppercase repository name and the org is `Metacognixion-labs`, so the
      # owner is lowercased here; infra/scripts/deploy.sh and docker-compose.prod.yml default to
      # the same `ghcr.io/metacognixion-labs/voice-agent-backend`. A pull request's ref name is
      # `<n>/merge`, which is not a valid tag, so the branch tag exists on push only.
      - name: Image name and tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voice-agent-backend"
          TAG="sha-${GITHUB_SHA::7}"
          TAGS="$IMAGE:$TAG"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            TAGS="$TAGS,$IMAGE:$GITHUB_REF_NAME"
            if [ "$GITHUB_REF_NAME" = main ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          fi
          { echo "image=$IMAGE"; echo "tag=$TAG"; echo "tags=$TAGS"; } >> "$GITHUB_OUTPUT"
      # Pull requests build the image (the Dockerfile must keep working) and push nothing.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish on push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Both entrypoints ship in the same image, and the deployed Prisma client must be the
      # generated one (a bare reinstall has no `PrismaClient` export and fails at boot).
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          IMG=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker run --rm --entrypoint sh "$IMG" -c 'test -f dist/main.js && test -f dist/worker.js && node --check dist/main.js && node --check dist/worker.js'
          docker run --rm --entrypoint node \
            -e DATABASE_URL=postgresql://u:p@localhost:5432/d -e ADMIN_DATABASE_URL=postgresql://u:p@localhost:5432/d \
            "$IMG" -e "import('@portal/db').then(m => { if (typeof m.PrismaClient !== 'function') throw new Error('generated Prisma client missing from the image'); console.log('db package loads'); })"
        if: github.event_name == 'push'

  # ------------------------------------------------------------------ 3. staging (develop → EC2 over SSM)
  #
  # Runs only when the repository has the staging environment configured:
  #   vars:    STAGING_INSTANCE_ID  (i-…), AWS_REGION
  #   secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the `ci` IAM user
  #            (ssm:SendCommand on that instance, ssm:GetCommandInvocation — nothing else)
  # The instance pulls its own configuration from SSM Parameter Store (infra/scripts/deploy.sh);
  # CI never sees a secret of the running system, and nothing here is hard-coded.
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_INSTANCE_ID != ''
    environment:
      name: staging
      url: https://${{ vars.STAGING_API_DOMAIN }}/health
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy over SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          TAG: ${{ needs.image.outputs.tag }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          # The instance has the repo's infra/ checked out at /opt/voice-agent/infra (deploy.sh
          # refreshes it with the compose file and Caddyfile from this ref).
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "voice-agent staging $TAG" \
            --parameters "commands=[\"set -e\",\"cd /opt/voice-agent/infra && git fetch --quiet origin $GITHUB_SHA && git checkout --quiet $GITHUB_SHA\",\"sudo BACKEND_IMAGE=$IMAGE /opt/voice-agent/infra/infra/scripts/deploy.sh staging $TAG\"]" \
            --query 'Command.CommandId' --output text)
          echo "command $COMMAND_ID"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text; exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
      - name: Staging answers over TLS
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "https://${{ vars.STAGING_API_DOMAIN }}/health"
          curl -fsS --max-time 10 "https://${{ vars.STAGING_API_DOMAIN }}/health/ready"

  # ------------------------------------------------------------------ 4. portal (develop → S3 + CloudFront, ADR 0008)
  #
  # Runs when the staging environment has the frontend stack's outputs:
  #   vars:    STAGING_PORTAL_BUCKET, STAGING_PORTAL_DISTRIBUTION_ID, STAGING_API_DOMAIN,
  #            STAGING_AUTH0_DOMAIN, STAGING_AUTH0_CLIENT_ID, STAGING_AUTH0_AUDIENCE,
  #            STAGING_POSTHOG_KEY (optional), STAGING_POSTHOG_HOST (optional)
  #   secrets: the same AWS keys as deploy-staging (the CI user also holds the frontend policy)
  # NEXT_PUBLIC_* is baked at build time, so this is a separate build from the local one.
  deploy-portal-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_PORTAL_BUCKET != ''
    environment:
      name: staging
      url: https://${{ vars.STAGING_PORTAL_HOST }}/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and publish the portal
        env:
          FRONTEND_BUCKET: ${{ vars.STAGING_PORTAL_BUCKET }}
          FRONTEND_DISTRIBUTION_ID: ${{ vars.STAGING_PORTAL_DISTRIBUTION_ID }}
          NEXT_PUBLIC_API_URL: https://${{ vars.STAGING_API_DOMAIN }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.STAGING_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.STAGING_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ vars.STAGING_AUTH0_AUDIENCE }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.STAGING_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.STAGING_POSTHOG_HOST }}
          # D14: browser errors. A Sentry DSN is public by design (it can only submit events).
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.STAGING_PORTAL_SENTRY_DSN }}
          NEXT_PUBLIC_RELEASE: sha-${{ github.sha }}
        run: infra/scripts/deploy-frontend.sh web staging
      - name: Portal answers over TLS
        run: |
          set -euo pipefail
          host="${{ vars.STAGING_PORTAL_HOST }}"
          [ -n "$host" ] || { echo "::error::STAGING_PORTAL_HOST is not set on the staging environment (e.g. app-staging.oraly.ai)"; exit 1; }
          curl -fsS --max-time 10 -o /dev/null -w '%{http_code}\n' "https://$host/login/"

  # ------------------------------------------------------------------ 5. console (develop → S3 + CloudFront, ADR 0008, D14)
  #
  # The staff console, built against the *staff* Auth0 tenant. Runs when the staging
  # environment has the `voice-agent-staging-admin` frontend stack's outputs:
  #   vars:    STAGING_ADMIN_BUCKET, STAGING_ADMIN_DISTRIBUTION_ID, STAGING_ADMIN_HOST,
  #            STAGING_STAFF_AUTH0_DOMAIN, STAGING_STAFF_AUTH0_CLIENT_ID,
  #            STAGING_STAFF_AUTH0_AUDIENCE, STAGING_PORTAL_HOST, STAGING_ADMIN_SENTRY_DSN (optional)
  # STAGING_ADMIN_BUCKET is read in the job-level `if`, so it must be a *repository*
  # variable — an environment-scoped one reads as empty there and the job skips silently.
  deploy-admin-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_ADMIN_BUCKET != ''
    environment:
      name: staging
      url: https://${{ vars.STAGING_ADMIN_HOST }}/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and publish the console
        env:
          FRONTEND_BUCKET: ${{ vars.STAGING_ADMIN_BUCKET }}
          FRONTEND_DISTRIBUTION_ID: ${{ vars.STAGING_ADMIN_DISTRIBUTION_ID }}
          NEXT_PUBLIC_API_URL: https://${{ vars.STAGING_API_DOMAIN }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ vars.STAGING_STAFF_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ vars.STAGING_STAFF_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ vars.STAGING_STAFF_AUTH0_AUDIENCE }}
          NEXT_PUBLIC_PORTAL_URL: https://${{ vars.STAGING_PORTAL_HOST }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.STAGING_ADMIN_SENTRY_DSN }}
          NEXT_PUBLIC_RELEASE: sha-${{ github.sha }}
        run: infra/scripts/deploy-frontend.sh admin staging
      - name: Console answers over TLS
        run: |
          set -euo pipefail
          host="${{ vars.STAGING_ADMIN_HOST }}"
          [ -n "$host" ] || { echo "::error::STAGING_ADMIN_HOST is not set (e.g. admin-staging.oraly.ai)"; exit 1; }
          curl -fsS --max-time 10 -o /dev/null -w '%{http_code}\n' "https://$host/"
