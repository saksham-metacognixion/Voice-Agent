# Customer tenant — Auth0 Deploy CLI source of truth (ADR 0002).
#
#   pnpm auth0:export customer   # pull the live tenant into infra/auth0/export/customer/ and diff it against this file
#   pnpm auth0:plan   customer   # render + a0deploy --dry-run: what would change, applying nothing
#   pnpm auth0:deploy customer   # apply
#
# Names wrapped in double hashes (PORTAL_URL below is one) are substituted from .env by
# infra/scripts/auth0.mjs before a0deploy sees the file. One that .env does not set is a
# hard error, never an empty string in a callback URL or an action secret.
#
# Two things about this file that will cost an afternoon if they are missed:
#
#  * a0deploy matches a client BY NAME. A name here that does not exist in the tenant
#    CREATES a second application with a new client_id, and AUTH0_CLIENT_ID in .env then
#    points at the old one. Run `pnpm auth0:export customer` first and make the names below
#    match what is really there (or rename the app in the dashboard to match this file).
#  * `triggers:` is what binds an action so it actually runs. Deploying an action without
#    it leaves it built and idle — the documented D1 time sink in docs/runbooks/auth0.md.
#
# Deliberately not managed here: social connection `options` (the Google/Microsoft client
# keys live in the dashboard, and an empty `options` block in a deploy would wipe them),
# and the M2M application this deploy authenticates as — a config that can rewrite its own
# credentials is a config that can lock itself out.

tenant:
  friendly_name: Voice Agent Portal
  # `ar` since the portal speaks Arabic: the SPA sends `ui_locales` with the portal's language.
  enabled_locales:
    - en
    - fr-CA
    - ar
  # Auth0 defaults, stated rather than inherited: 7-day absolute, 3-day idle.
  session_lifetime: 168
  idle_session_lifetime: 72

clients:
  # The name is how a0deploy finds this application, and the tenant calls it "Voice Agent"
  # (verified in the dashboard, 22 Sep 2026 — client l0UZ5TKd…, the one AUTH0_CLIENT_ID
  # points at). Calling it anything else here does not fail: it CREATES a second
  # application with a new client_id and leaves .env pointing at the old one, so login goes
  # on failing and the deploy looks like it did nothing. Rename it here and in the
  # dashboard together, or not at all.
  - name: Voice Agent
    description: Customer portal (frontend/web). Public client on Authorization Code + PKCE (ADR 0008).
    app_type: spa
    is_first_party: true
    oidc_conformant: true
    # No client_credentials, no implicit: a static export has no server to hold a secret.
    grant_types:
      - authorization_code
      - refresh_token
    token_endpoint_auth_method: none
    # The app origin itself, not /auth/callback — a static export has no route handlers.
    # Two entries, because one tenant serves more than one origin: PORTAL_URL is this
    # environment's app, and PORTAL_ALT_URL is an optional second — a developer on
    # localhost while staging is deployed against the same tenant. With only one
    # slot, deploying for staging locks every developer out of login. When
    # PORTAL_ALT_URL is unset in .env its line is dropped rather than sent empty.
    callbacks:
      - '##PORTAL_URL##'
      - '##PORTAL_ALT_URL?##'
    allowed_logout_urls:
      - '##PORTAL_URL##'
      - '##PORTAL_ALT_URL?##'
    web_origins:
      - '##PORTAL_URL##'
      - '##PORTAL_ALT_URL?##'
    allowed_origins:
      - '##PORTAL_URL##'
      - '##PORTAL_ALT_URL?##'
    cross_origin_authentication: false
    # Refresh Token Rotation — without it a SPA cannot hold a session past the access token.
    refresh_token:
      rotation_type: rotating
      expiration_type: expiring
      leeway: 30
      token_lifetime: 2592000
      idle_token_lifetime: 1209600
      infinite_token_lifetime: false
      infinite_idle_token_lifetime: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000

resourceServers:
  - name: Portal API
    # An API identifier cannot be edited after creation. Changing this value creates a
    # second API and orphans every token minted for the first one.
    identifier: '##AUTH0_CUSTOMER_AUDIENCE##'
    signing_alg: RS256
    token_lifetime: 86400
    token_lifetime_for_web: 7200
    skip_consent_for_verifiable_first_party_clients: true
    # Refresh tokens for the SPA come from here, not from the client.
    allow_offline_access: true
    # Zero scopes on purpose: authorisation is `memberships.role` (§6.1), not a token claim.
    enforce_policies: false
    scopes: []

databases:
  - name: Username-Password-Authentication
    strategy: auth0
    enabled_clients:
      # The SPA by its tenant name (see `clients:`). "Portal Web" was never a client here,
      # and a0deploy would have enabled the connection for no application at all.
      - Voice Agent
    options:
      requires_username: false
      disable_signup: false
      brute_force_protection: true
      passwordPolicy: good
      # password_history (last 5) and password_no_personal_info are the paid
      # "password-advanced-options" entitlement: the 30 Sep 2026 deploy answered 403
      # feature_not_entitled on this plan. Restore both on a plan that includes them.

connections:
  # §6.2 — social sign-in. `options` (client keys) stay in the dashboard; see the header.
  # google-oauth2 is managed in the dashboard only (its client keys live there, and it is
  # enabled for "Voice Agent"). Listed here without `options`, a0deploy sent an empty
  # options object once the M2M app could read connection options, and the Management API
  # answered 400 "Too few properties defined (0)" (30 Sep 2026). AUTH0_ALLOW_DELETE is
  # false, so leaving it out of this file deletes nothing.

# §6.2 rate limiting: "login 5 failures / 15 min per email+IP, then CAPTCHA; sign-up
# 3 / hour / IP". Brute force counts per email+IP and blocks at the fifth failure (Auth0
# lifts the block on a password reset or from the dashboard — not after 15 minutes; the
# window is Auth0's, not ours). Sign-up throttling is suspicious-IP throttling's
# pre-user-registration stage: 3 attempts, one regained every 20 minutes (the rate is in
# milliseconds) = 3 per hour per IP. The CAPTCHA step is Auth0 Bot Detection, an Attack
# Protection add-on this tenant's plan does not include — recorded, not configured.
attackProtection:
  bruteForceProtection:
    enabled: true
    mode: count_per_identifier_and_ip
    max_attempts: 5
    shields:
      - block
  breachedPasswordDetection:
    enabled: true
    method: standard
    shields:
      - admin_notification
    # Required by the Management API alongside the admin_notification shield (400
    # "Please provide an admin_notification_frequency" on the 30 Sep 2026 deploy).
    admin_notification_frequency:
      - immediately
  suspiciousIpThrottling:
    enabled: true
    shields:
      - admin_notification
      - block
    stage:
      pre-login:
        max_attempts: 100
        rate: 864000
      pre-user-registration:
        max_attempts: 3
        rate: 1200000

# §6.2 / A5 — opt-in two-factor. The policy is empty on purpose: MFA is never forced by
# the tenant. customer-post-login.js asks for it when A5 requests it (enrolment) and on
# every sign-in of someone already enrolled. Without an enabled factor Auth0 has nothing
# to enrol, the A5 button signs the person straight back in, and the status stays "Not
# enabled" — the 24 Sep 2026 bug. Recovery codes so a lost phone is not a locked account.
guardianPolicies:
  policies: []

guardianFactors:
  - name: otp
    enabled: true
  - name: recovery-code
    enabled: true
  - name: sms
    enabled: false
  - name: email
    enabled: false
  - name: push-notification
    enabled: false
  - name: webauthn-platform
    enabled: false
  - name: webauthn-roaming
    enabled: false
  - name: duo
    enabled: false

actions:
  # §6.2 — disposable email domains refused before the account exists. The dependency
  # version is pinned to the API's (`backend/api/package.json`); disposable-email.test.ts
  # fails when the two drift.
  - name: customer-pre-registration
    code: ./actions/customer-pre-registration.js
    dependencies:
      - name: disposable-email-domains-js
        version: 1.26.0
    deployed: true
    status: built
    secrets: []
    supported_triggers:
      - id: pre-user-registration
        version: v2

  # §13.2 step 1 — the normal path into `users`.
  - name: customer-post-registration
    code: ./actions/customer-post-registration.js
    dependencies: []
    deployed: true
    status: built
    secrets:
      - name: API_PUBLIC_URL
        value: '##API_PUBLIC_URL##'
      - name: ACTION_SECRET
        value: '##AUTH0_CUSTOMER_ACTION_SECRET##'
    supported_triggers:
      - id: post-user-registration
        version: v2

  # Claims on the ACCESS token (the API verifies that one), plus the `user.login` safety
  # net. Claim names are in lockstep with CLAIM_* in shared/schemas/src/enums.ts.
  - name: customer-post-login
    code: ./actions/customer-post-login.js
    dependencies: []
    deployed: true
    status: built
    secrets:
      - name: API_PUBLIC_URL
        value: '##API_PUBLIC_URL##'
      - name: ACTION_SECRET
        value: '##AUTH0_CUSTOMER_ACTION_SECRET##'
    supported_triggers:
      - id: post-login
        version: v3

# Built is not running. This is the binding.
triggers:
  pre-user-registration:
    - action_name: customer-pre-registration
      display_name: customer-pre-registration
  post-user-registration:
    - action_name: customer-post-registration
      display_name: customer-post-registration
  post-login:
    - action_name: customer-post-login
      display_name: customer-post-login
